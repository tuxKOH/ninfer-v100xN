services:
  ninfer:
    image: ${NINFER_IMAGE:-ninfer-v100:0.2.1}
    build:
      context: .
      args:
        CUDA_ARCH: "70"
        BUILD_JOBS: ${NINFER_BUILD_JOBS:-2}
    stdin_open: true
    tty: true
    ipc: host
    ports:
      - "${NINFER_PORT:-8080}:8080"
    environment:
      NINFER_MODEL: ${NINFER_MODEL:-}
      HF_TOKEN: ${HF_TOKEN:-}
      TERM: ${TERM:-xterm-256color}
    volumes:
      - models:/Models/ninfer-V100X2
      - data:/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  models:
  data:
